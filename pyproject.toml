[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "build-your-agent"
version = "0.1.0"
description = "一个面向学习和实战的 AI Agent 练习工程"
requires-python = ">=3.10"

[project.scripts]
build-your-agent = "build_your_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

